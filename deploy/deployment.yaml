apiVersion: apps/v1
kind: Deployment
metadata:
  name: demobox
  labels:
    app: demobox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demobox
  template:
    metadata:
      labels:
        app: demobox
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: demobox
          image: registry.cn-hangzhou.aliyuncs.com/snowbo/demobox:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              hostPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
